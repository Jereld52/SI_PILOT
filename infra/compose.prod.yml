name: si-pnfor-pilote

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-si_pnfor}
      POSTGRES_USER: ${POSTGRES_USER:-pnfor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pnfor} -d ${POSTGRES_DB:-si_pnfor}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY dans infra/.env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Definir FIELD_ENCRYPTION_KEY dans infra/.env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pnfor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-si_pnfor}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY_HEADERS: "true"
      SERVE_FRONTEND: "false"
      UPLOAD_DIR: /app/data/uploads
      LOG_LEVEL: INFO
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
